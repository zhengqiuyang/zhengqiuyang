name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-light.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark

      - name: Commit snake into assets/
        run: |
          mkdir -p assets
          cp dist/github-snake-light.svg dist/github-snake-dark.svg assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake-light.svg assets/github-snake-dark.svg
          git diff --cached --quiet || (git commit -m "chore: refresh contribution snake [skip ci]" && git push)
